<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <title>Maize — Demo Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=14">
    <link rel="stylesheet" href="/static/css/landing.css?v=4">
    <style>
        /* One phone screen, no scroll. Everything here is scoped to
           .demoday-page so it cannot leak into the landing page, which shares
           the .demo-form / .btn classes this page reuses for its tokens. */
        .demoday-page {
            min-height: 100vh;
            min-height: 100svh;
            background: var(--maize-light-cream);
        }

        .demoday-wrap {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.25rem;
            max-width: 480px;
            margin: 0 auto;
            padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
        }

        .demoday-mark {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .demoday-mark img { height: 26px; width: auto; }
        .demoday-mark span {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            color: var(--maize-charcoal);
        }

        .demoday-head h1 {
            font-size: 1.7rem;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: var(--maize-charcoal);
            margin-bottom: 0.35rem;
        }
        .demoday-head .demoday-sub {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--maize-cocoa);
            margin-bottom: 0.5rem;
        }
        .demoday-head .demoday-body {
            font-size: 0.9rem;
            line-height: 1.45;
            color: var(--maize-cocoa);
            opacity: 0.85;
        }

        /* Tighter than the landing form: the whole thing has to clear the fold. */
        .demoday-page .demo-form .form-group { margin-bottom: 0.7rem; }
        .demoday-page .demo-form label { margin-bottom: 0.3rem; }
        .demoday-page .demo-form input[type="text"],
        .demoday-page .demo-form input[type="email"] {
            padding: 0.7rem 0.85rem;
            font-size: 16px; /* < 16px makes iOS Safari zoom on focus */
        }

        .demoday-check {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin: 0.15rem 0 0.85rem;
            cursor: pointer;
        }
        .demoday-check input {
            width: 1.15rem;
            height: 1.15rem;
            margin-top: 0.1rem;
            flex-shrink: 0;
            accent-color: var(--maize-amber);
        }
        .demoday-check span {
            font-size: 0.88rem;
            line-height: 1.35;
            color: var(--maize-cocoa);
        }

        .demoday-fine {
            margin-top: 0.7rem;
            font-size: 0.75rem;
            line-height: 1.4;
            text-align: center;
            color: var(--maize-cocoa);
            opacity: 0.6;
        }

        .demoday-page .form-status { margin-top: 0.7rem; font-size: 0.9rem; }

        .demoday-thanks h2 {
            font-size: 1.45rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: var(--maize-charcoal);
            margin-bottom: 0.9rem;
        }
        .demoday-thanks a {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--maize-orange);
        }

        /* Short phones (iPhone SE and similar) — shave the optional air. */
        @media (max-height: 700px) {
            .demoday-wrap { gap: 0.9rem; padding-top: 0.9rem; }
            .demoday-head h1 { font-size: 1.45rem; }
            .demoday-head .demoday-sub { font-size: 0.98rem; }
            .demoday-head .demoday-body { font-size: 0.84rem; }
            .demoday-page .demo-form .form-group { margin-bottom: 0.55rem; }
            .demoday-page .btn-large { padding: 0.8rem 1.5rem; }
        }
    </style>
</head>
<body class="landing-page demoday-page">
    <main class="demoday-wrap">
        <div class="demoday-mark">
            <img src="/static/images/maize-logo.png" alt="Maize">
            <span>Maize</span>
        </div>

        <div id="demoday-panel">
            <div class="demoday-head">
                <h1>You just saw Maize.</h1>
                <p class="demoday-sub">Tell us the class you wish it had been in.</p>
                <p class="demoday-body">Maize is an AI teaching assistant that runs on a specific course's actual materials, not a general chatbot.</p>
            </div>

            <form id="demoday-form" class="demo-form" style="margin-top:1.1rem;" novalidate>
                <div class="form-group">
                    <label for="dd-course">Which class, and who taught it? <span class="required">*</span></label>
                    <input type="text" id="dd-course" name="course" required
                           autocomplete="off" autocapitalize="words" enterkeyhint="next"
                           placeholder="MATH 112, Prof. Smith">
                </div>
                <div class="form-group">
                    <label for="dd-email">Email <span class="required">*</span></label>
                    <input type="email" id="dd-email" name="email" required
                           autocomplete="email" autocapitalize="off" autocorrect="off"
                           inputmode="email" enterkeyhint="next"
                           placeholder="you@yale.edu">
                </div>
                <div class="form-group">
                    <label for="dd-name">Name</label>
                    <input type="text" id="dd-name" name="name"
                           autocomplete="name" enterkeyhint="done" placeholder="Optional">
                </div>

                <label class="demoday-check" for="dd-optin">
                    <input type="checkbox" id="dd-optin" name="opt_in">
                    <span>Email me if Maize comes to a class of mine.</span>
                </label>

                <button type="submit" class="btn btn-primary btn-large btn-full" id="dd-submit">Send</button>
                <p id="dd-status" class="form-status" role="status" aria-live="polite"></p>
                <p class="demoday-fine">We may share which courses students name with faculty at Yale.</p>
            </form>
        </div>
    </main>

    <script>
        (function () {
            var form = document.getElementById('demoday-form');
            var btn = document.getElementById('dd-submit');
            var status = document.getElementById('dd-status');
            var panel = document.getElementById('demoday-panel');

            // utm_source / utm_campaign ride along with the submission so the
            // QR poster that produced the scan is identifiable in the inbox.
            var params = new URLSearchParams(window.location.search);
            var utmSource = (params.get('utm_source') || '').slice(0, 120);
            var utmCampaign = (params.get('utm_campaign') || '').slice(0, 120);

            function fail(msg) {
                status.textContent = msg;
                status.className = 'form-status error';
                btn.disabled = false;
                btn.textContent = 'Send';
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                var course = document.getElementById('dd-course').value.trim();
                var email = document.getElementById('dd-email').value.trim();
                var name = document.getElementById('dd-name').value.trim();
                var optIn = document.getElementById('dd-optin').checked;

                status.textContent = '';
                status.className = 'form-status';

                if (!course) { return fail('Please tell us the class.'); }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    return fail('Please enter a valid email address.');
                }

                btn.disabled = true;
                btn.textContent = 'Sending...';

                // Venue wifi: abort rather than leave the visitor on a spinner
                // forever, and say so plainly so they can just tap Send again.
                var controller = new AbortController();
                var timer = setTimeout(function () { controller.abort(); }, 15000);

                try {
                    var response = await fetch('/api/demo-request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            source: 'demoday',
                            course: course,
                            email: email,
                            name: name,
                            opt_in: optIn,
                            utm_source: utmSource,
                            utm_campaign: utmCampaign
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timer);

                    var data = {};
                    try { data = await response.json(); } catch (parseErr) { data = {}; }

                    if (!response.ok) {
                        return fail(data.error || 'Something went wrong. Please tap Send again.');
                    }

                    // Success replaces the form in place — no redirect. Typed
                    // values are irrelevant now, so the whole panel is swapped.
                    panel.innerHTML =
                        '<div class="demoday-thanks">' +
                        '<h2>Thanks — we\'ve got it.</h2>' +
                        '<a href="/">Know a professor who\'d try this? Send them here.</a>' +
                        '</div>';
                } catch (err) {
                    clearTimeout(timer);
                    if (err && err.name === 'AbortError') {
                        fail('That took too long — the wifi here is spotty. Tap Send to try again.');
                    } else {
                        fail('No connection. Check your signal and tap Send again.');
                    }
                }
            });
        })();
    </script>
</body>
</html>
