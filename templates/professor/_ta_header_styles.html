{# Styles for _ta_header.html. Include inside each page's <style> block.
   Kept as a partial because the professor templates have no shared base layout. #}
/* The bar is a sibling of .admin-main, which is max-width 1200px with 2rem of
   padding. Without matching that on an inner wrapper the contents sit flush
   against the viewport edge while the page body below is inset. The border stays
   full-bleed so the divider still spans the window. */
.ta-context-bar {
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 28px;
}
.ta-context-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
}
.ta-back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #6b7280;
    text-decoration: none;
    padding: 18px 0 0 0;
}
.ta-back-link:hover { color: #374151; }
.ta-back-link svg { flex-shrink: 0; }

.ta-context-title {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    margin: 10px 0 16px 0;
}
.ta-context-title h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.2;
}
.ta-context-course {
    font-size: 14px;
    color: #6b7280;
}
.ta-status-pill {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
}
.ta-status-pill--draft  { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.ta-status-pill--paused { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
.ta-status-pill--active { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

/* Tabs sit on the container's bottom border, classic browser-tab style. */
.ta-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: -1px;
    overflow-x: auto;
}
.ta-tab {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    color: #6b7280;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    white-space: nowrap;
}
.ta-tab:hover { color: #111827; background: #f9fafb; }
.ta-tab--active {
    color: #111827;
    background: #ffffff;
    border-color: #e5e7eb;
    /* Cover the container border so the active tab joins the page body. */
    box-shadow: 0 1px 0 0 #ffffff;
}
@media (max-width: 640px) {
    .ta-context-inner { padding: 0 1rem; }
    .ta-context-title h1 { font-size: 21px; }
    .ta-tab { padding: 10px 14px; }
}
